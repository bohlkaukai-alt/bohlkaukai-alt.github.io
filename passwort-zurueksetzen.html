<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen – MiniJob Finder</title>
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
    window.MINIJOB_FIREBASE_CONFIG = {
        apiKey: "AIzaSyBx57dh1O6NoLahmoYFSm0byLzzyKJKhj8",
        authDomain: "minijob-41400.firebaseapp.com",
        projectId: "minijob-41400",
        storageBucket: "minijob-41400.firebasestorage.app",
        messagingSenderId: "910969132661",
        appId: "1:910969132661:web:1507192ed39cd897db4a3c"
    };
    firebase.initializeApp(window.MINIJOB_FIREBASE_CONFIG);
    const auth = firebase.auth();

    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function showResetError(message) {
        const info = document.getElementById('reset-info');
        if (info) {
            info.className = 'auth-error';
            info.textContent = message;
        }
    }

    const mode = getParam('mode');
    const oobCode = getParam('oobCode');

    document.addEventListener('DOMContentLoaded', async function () {
        if (mode !== 'resetPassword' || !oobCode) {
            showResetError('Der Passwort-Link ist ungültig oder unvollständig. Bitte fordere einen neuen Link an.');
            document.getElementById('reset-form')?.classList.add('hidden');
            return;
        }

        try {
            const email = await auth.verifyPasswordResetCode(oobCode);
            document.getElementById('reset-info').textContent = 'Neues Passwort für: ' + email;
        } catch (err) {
            showResetError('Der Passwort-Link ist abgelaufen oder ungültig. Bitte fordere einen neuen Link an.');
            document.getElementById('reset-form')?.classList.add('hidden');
        }
    });

    async function confirmNewPassword() {
        const pw1 = document.getElementById('new-password')?.value || '';
        const pw2 = document.getElementById('new-password-repeat')?.value || '';
        const btn = document.getElementById('reset-submit');

        if (!(pw1.length >= 8 && /[A-ZÄÖÜ]/.test(pw1) && /[a-zäöüß]/.test(pw1) && /[0-9]/.test(pw1) && /[^A-Za-zÄÖÜäöüß0-9]/.test(pw1))) {
            showResetError('Das neue Passwort muss mindestens 8 Zeichen, einen Großbuchstaben, einen Kleinbuchstaben, eine Zahl und ein Sonderzeichen enthalten.');
            return;
        }

        if (pw1.length < 8) {
            showResetError('Das neue Passwort muss mindestens 8 Zeichen haben.');
            return;
        }

        if (pw1 !== pw2) {
            showResetError('Die Passwörter stimmen nicht überein.');
            return;
        }

        if (btn) {
            btn.disabled = true;
            btn.textContent = 'Wird geändert...';
        }

        try {
            await auth.confirmPasswordReset(oobCode, pw1);
            document.getElementById('reset-form')?.classList.add('hidden');
            document.getElementById('reset-success')?.classList.remove('hidden');
            document.getElementById('reset-info').className = 'small-muted';
            document.getElementById('reset-info').textContent = 'Dein Passwort wurde erfolgreich geändert.';
        } catch (err) {
            showResetError('Passwort konnte nicht geändert werden: ' + (err.message || err));
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Passwort ändern';
            }
        }
    }
</script>
</body>
</html>
